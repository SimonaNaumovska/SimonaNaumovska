<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Simona Naumovska profile dashboard</title>
  <desc id="desc">Animated systems engineering dashboard showing current focus areas and engineering workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #8b949e; }
      .soft { fill: #c9d1d9; }
      .line { stroke: #30363d; stroke-width: 1; }
      .route { fill: none; stroke: #58a6ff; stroke-width: 1.6; stroke-dasharray: 5 8; opacity: .55; animation: flow 5s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -52; } }
      @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.9) } 50% { opacity:1; transform:scale(1.18) } }
      @keyframes blink { 0%,100% { opacity:.28 } 50% { opacity:1 } }
      @keyframes scan { 0% { transform: translateX(-380px); opacity:0 } 15% { opacity:.45 } 85% { opacity:.45 } 100% { transform: translateX(760px); opacity:0 } }
    </style>
  </defs>

  <rect width="1100" height="500" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="498" rx="21" fill="none" stroke="#30363d"/>

  <rect x="44" y="38" width="6" height="54" rx="3" fill="url(#accent)"/>
  <text x="68" y="61" class="sans" fill="#f0f6fc" font-size="28" font-weight="700" letter-spacing=".5">SIMONA NAUMOVSKA</text>
  <text x="68" y="87" class="mono muted" font-size="14" letter-spacing="1.4">SOFTWARE SYSTEMS ENGINEER</text>

  <g transform="translate(760 42)">
    <rect width="296" height="54" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="22" cy="27" r="6" fill="#3fb950" filter="url(#glow)" class="pulse"/>
    <text x="40" y="23" class="mono muted" font-size="10" letter-spacing="1.2">CURRENT FOCUS</text>
    <text x="40" y="41" class="sans soft" font-size="15" font-weight="650">Project OS</text>
  </g>

  <line x1="44" y1="118" x2="1056" y2="118" class="line"/>

  <g transform="translate(44 146)">
    <rect width="390" height="300" rx="16" fill="#0d1117" stroke="#30363d"/>
    <text x="22" y="30" class="mono muted" font-size="11" letter-spacing="1.2">SYSTEM MAP</text>

    <path d="M195 148 C145 112 114 98 76 81" class="route"/>
    <path d="M195 148 C250 110 283 96 320 80" class="route"/>
    <path d="M195 148 C135 186 104 206 72 228" class="route"/>
    <path d="M195 148 C253 186 287 207 321 229" class="route"/>

    <circle cx="195" cy="148" r="43" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <circle cx="195" cy="148" r="52" fill="none" stroke="#58a6ff" opacity=".18" class="pulse"/>
    <text x="195" y="144" text-anchor="middle" class="sans" fill="#f0f6fc" font-size="13" font-weight="700">SYSTEMS</text>
    <text x="195" y="161" text-anchor="middle" class="mono muted" font-size="9">ENGINEERING</text>

    <g>
      <circle cx="72" cy="78" r="6" fill="#bc8cff" class="pulse"/>
      <text x="88" y="75" class="sans soft" font-size="12" font-weight="600">Reverse engineering</text>
      <text x="88" y="91" class="mono muted" font-size="9">code, data, behavior</text>
    </g>
    <g>
      <circle cx="318" cy="78" r="6" fill="#58a6ff" class="pulse"/>
      <text x="302" y="75" text-anchor="end" class="sans soft" font-size="12" font-weight="600">Architecture</text>
      <text x="302" y="91" text-anchor="end" class="mono muted" font-size="9">boundaries, state, flow</text>
    </g>
    <g>
      <circle cx="72" cy="232" r="6" fill="#3fb950" class="pulse"/>
      <text x="88" y="229" class="sans soft" font-size="12" font-weight="600">Modernization</text>
      <text x="88" y="245" class="mono muted" font-size="9">legacy to maintainable</text>
    </g>
    <g>
      <circle cx="318" cy="232" r="6" fill="#f2cc60" class="pulse"/>
      <text x="302" y="229" text-anchor="end" class="sans soft" font-size="12" font-weight="600">Developer tooling</text>
      <text x="302" y="245" text-anchor="end" class="mono muted" font-size="9">context, automation, agents</text>
    </g>
  </g>

  <g transform="translate(458 146)">
    <rect width="598" height="138" rx="16" fill="#0d1117" stroke="#30363d"/>
    <text x="22" y="30" class="mono muted" font-size="11" letter-spacing="1.2">ENGINEERING LOOP</text>

    <line x1="42" y1="82" x2="550" y2="82" stroke="#30363d" stroke-width="2"/>
    <rect x="20" y="57" width="48" height="48" rx="12" fill="#161b22" stroke="#58a6ff"/>
    <rect x="144" y="57" width="48" height="48" rx="12" fill="#161b22" stroke="#bc8cff"/>
    <rect x="268" y="57" width="48" height="48" rx="12" fill="#161b22" stroke="#f2cc60"/>
    <rect x="392" y="57" width="48" height="48" rx="12" fill="#161b22" stroke="#3fb950"/>
    <rect x="516" y="57" width="48" height="48" rx="12" fill="#161b22" stroke="#ff7b72"/>

    <text x="44" y="85" text-anchor="middle" class="mono soft" font-size="10">01</text>
    <text x="168" y="85" text-anchor="middle" class="mono soft" font-size="10">02</text>
    <text x="292" y="85" text-anchor="middle" class="mono soft" font-size="10">03</text>
    <text x="416" y="85" text-anchor="middle" class="mono soft" font-size="10">04</text>
    <text x="540" y="85" text-anchor="middle" class="mono soft" font-size="10">05</text>

    <text x="44" y="122" text-anchor="middle" class="mono muted" font-size="9">DISCOVER</text>
    <text x="168" y="122" text-anchor="middle" class="mono muted" font-size="9">UNDERSTAND</text>
    <text x="292" y="122" text-anchor="middle" class="mono muted" font-size="9">DESIGN</text>
    <text x="416" y="122" text-anchor="middle" class="mono muted" font-size="9">BUILD</text>
    <text x="540" y="122" text-anchor="middle" class="mono muted" font-size="9">VERIFY</text>

    <circle cx="44" cy="82" r="3" fill="#58a6ff" class="blink"/>
    <circle cx="168" cy="82" r="3" fill="#bc8cff" class="blink" style="animation-delay:.3s"/>
    <circle cx="292" cy="82" r="3" fill="#f2cc60" class="blink" style="animation-delay:.6s"/>
    <circle cx="416" cy="82" r="3" fill="#3fb950" class="blink" style="animation-delay:.9s"/>
    <circle cx="540" cy="82" r="3" fill="#ff7b72" class="blink" style="animation-delay:1.2s"/>
  </g>

  <g transform="translate(458 304)">
    <rect width="598" height="142" rx="16" fill="#0d1117" stroke="#30363d"/>
    <text x="22" y="29" class="mono muted" font-size="11" letter-spacing="1.2">ACTIVE DOMAINS</text>

    <g transform="translate(22 50)">
      <rect width="170" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="16" cy="16" r="4" fill="#58a6ff"/>
      <text x="29" y="20" class="mono soft" font-size="10">SOFTWARE INTELLIGENCE</text>
    </g>
    <g transform="translate(206 50)">
      <rect width="177" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="16" cy="16" r="4" fill="#bc8cff"/>
      <text x="29" y="20" class="mono soft" font-size="10">AI ASSISTED ENGINEERING</text>
    </g>
    <g transform="translate(397 50)">
      <rect width="177" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
      <circle cx="16" cy="16" r="4" fill="#3fb950"/>
      <text x="29" y="20" class="mono soft" font-size="10">LEGACY MODERNIZATION</text>
    </g>

    <g transform="translate(22 92)">
      <text x="0" y="12" class="mono muted" font-size="9">PYTHON</text>
      <text x="70" y="12" class="mono muted" font-size="9">JAVA / JVM</text>
      <text x="166" y="12" class="mono muted" font-size="9">TYPESCRIPT</text>
      <text x="262" y="12" class="mono muted" font-size="9">SQL</text>
      <text x="306" y="12" class="mono muted" font-size="9">AWS</text>
      <text x="350" y="12" class="mono muted" font-size="9">GIT</text>
      <text x="386" y="12" class="mono muted" font-size="9">MCP</text>
      <text x="428" y="12" class="mono muted" font-size="9">REACT</text>
      <text x="480" y="12" class="mono muted" font-size="9">POSTGRESQL</text>
    </g>
  </g>

  <rect x="460" y="147" width="1" height="136" fill="#58a6ff" opacity=".35" class="scan"/>
</svg>
