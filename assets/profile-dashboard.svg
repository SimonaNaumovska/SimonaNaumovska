<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Simona Naumovska profile hero</title>
  <desc id="desc">Readable profile hero highlighting Simona's systems engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1100" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="298" rx="21" fill="none" stroke="#30363d"/>

  <rect x="50" y="46" width="7" height="84" rx="4" fill="url(#accent)"/>
  <text x="82" y="82" class="sans" fill="#f0f6fc" font-size="42" font-weight="750">SIMONA NAUMOVSKA</text>
  <text x="82" y="116" class="sans" fill="#c9d1d9" font-size="22" font-weight="600">Software Systems Engineer</text>
  <text x="82" y="150" class="sans" fill="#8b949e" font-size="17">Reverse engineering • system architecture • developer tooling • AI-assisted engineering</text>

  <g transform="translate(50 190)">
    <rect width="315" height="70" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="28" cy="35" r="6" fill="#bc8cff"/>
    <text x="48" y="31" class="sans" fill="#f0f6fc" font-size="17" font-weight="700">Reverse engineering</text>
    <text x="48" y="50" class="sans" fill="#8b949e" font-size="13">Code, data, behavior</text>
  </g>

  <g transform="translate(392 190)">
    <rect width="315" height="70" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="28" cy="35" r="6" fill="#58a6ff"/>
    <text x="48" y="31" class="sans" fill="#f0f6fc" font-size="17" font-weight="700">System architecture</text>
    <text x="48" y="50" class="sans" fill="#8b949e" font-size="13">Boundaries, state, flow</text>
  </g>

  <g transform="translate(734 190)">
    <rect width="315" height="70" rx="14" fill="#161b22" stroke="#30363d"/>
    <circle cx="28" cy="35" r="6" fill="#3fb950"/>
    <text x="48" y="31" class="sans" fill="#f0f6fc" font-size="17" font-weight="700">Developer tooling</text>
    <text x="48" y="50" class="sans" fill="#8b949e" font-size="13">Context, automation, agents</text>
  </g>
</svg>
